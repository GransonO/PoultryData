name: poultry_data
description: Capture high-quality chicken photos and videos for agricultural data collection.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera & Media
  camera: ^0.10.5+9
  video_player: ^2.8.3

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.0

  # Permissions
  permission_handler: ^11.3.0

  # Storage & Files
  path_provider: ^2.1.2

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
